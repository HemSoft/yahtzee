name: Application quality

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.7'
      - name: Install locked dependencies without lifecycle scripts
        id: install
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Typecheck all workspaces and backend
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run typecheck
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run lint
      - name: Unit and backend tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run test
      - name: Web production build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run build:web
      - name: Desktop production build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run build:desktop
      - name: Android and iOS JavaScript and Hermes export
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          EXPO_OFFLINE: '1'
          EXPO_NO_TELEMETRY: '1'
          EXPO_PUBLIC_CONVEX_URL: https://fixture.invalid
        run: bun run build:mobile
      - name: Install client-test browser and host dependencies
        id: browsers
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Install pinned Electron binary outside the test timeout
        id: electron
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node apps/desktop/node_modules/electron/install.js
      - name: Client journeys and function-risk gate on Linux
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' && steps.electron.outcome == 'success' && runner.os == 'Linux' }}
        run: xvfb-run --auto-servernum bun run quality:measure
      - name: Client journeys and function-risk gate on Windows
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' && steps.electron.outcome == 'success' && runner.os == 'Windows' }}
        run: bun run quality:measure
      - name: Retain revision-bound qualification evidence
        if: ${{ always() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-${{ matrix.os }}-${{ github.sha }}
          path: |
            reports/clients/
            reports/quality/
          retention-days: 3
          if-no-files-found: warn

  quality-gate:
    name: quality-gate
    if: ${{ always() }}
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every validation job to succeed
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: |
          if [ "$VALIDATION_RESULT" != success ]; then
            echo "Validation did not succeed: $VALIDATION_RESULT"
            exit 1
          fi
